<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burin</title>
<link rel="icon" type="image/png" href="burin.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1014; color: #d7dbe0; font-family: system-ui, sans-serif; }
  #burin { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #status img { width: 96px; height: 96px; border-radius: 18px; }
  #status p { margin: 0; max-width: 34em; line-height: 1.5; }
  #status.hidden { display: none; }
</style>
</head>
<body>
<canvas id="burin"></canvas>
<div id="status">
  <img src="burin.png" alt="">
  <p id="message">Chargement de Burin…</p>
  <noscript><p>Burin a besoin de JavaScript pour fonctionner dans le navigateur.</p></noscript>
</div>
<script type="module">
  import init, { start } from "./burin.js";
  const message = document.getElementById("message");
  try {
    await init();
    start("burin");
    document.getElementById("status").classList.add("hidden");
  } catch (e) {
    message.textContent = "Burin n'a pas pu démarrer dans ce navigateur : " + e;
  }
</script>
</body>
</html>
