# Builds Burin for Macs with Apple Silicon on one of GitHub's Macs, and adds it to the release:
# Burin-<version>-macos-arm64.zip holding Burin.app. It runs when a release is published, or by
# hand for a given tag. The app is signed ad hoc only (no Apple developer account): the first time,
# right-click it and choose Open, or run `xattr -cr Burin.app`.
name: macOS (Apple Silicon)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v0.14.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
          rustup default 1.95.0

      - name: Build
        env:
          BURIN_ISSUES_URL: https://github.com/${{ github.repository }}/issues/new
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CARGO_ENCODED_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/burin
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Burin.app
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          APP=dist/Burin.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/aarch64-apple-darwin/release/burin "$APP/Contents/MacOS/burin"
          # The icon, at every size macOS asks for.
          ICONSET=dist/burin.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size release/burin.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double release/burin.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/burin.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Burin</string>
            <key>CFBundleDisplayName</key><string>Burin</string>
            <key>CFBundleIdentifier</key><string>cc.burin.Burin</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>burin</string>
            <key>CFBundleIconFile</key><string>burin</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>Burin project</string>
                <key>CFBundleTypeExtensions</key><array><string>burin</string></array>
                <key>CFBundleTypeRole</key><string>Editor</string>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          (cd dist && ditto -c -k --keepParent Burin.app "Burin-$VERSION-macos-arm64.zip")
          echo "ZIP=dist/Burin-$VERSION-macos-arm64.zip" >> "$GITHUB_ENV"

      - name: Check it starts
        run: |
          # It can't open a window here; it must at least load and say its version.
          ./dist/Burin.app/Contents/MacOS/burin --version || true

      - name: Add to the release
        run: |
          gh release upload "$TAG" "$ZIP" --clobber
          shasum -a 256 "$ZIP"
